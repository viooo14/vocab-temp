<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高考词汇检测卡</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #4f46e5; --primary-dark: #4338ca; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
        }
        .home-screen { padding: 20px; max-width: 600px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 28px; color: var(--primary); margin-bottom: 10px; }
        .header p { color: var(--text-light); font-size: 14px; }
        .stats-overview {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--card); padding: 20px; border-radius: 16px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-number { font-size: 24px; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 12px; color: var(--text-light); margin-top: 5px; }
        .groups-container { margin-top: 20px; }
        .section-title {
            font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
        }
        .progress-badge {
            background: var(--primary); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: normal;
        }
        .progress-badge.completed { background: var(--success); }
        .group-card {
            background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: pointer; transition: all 0.3s ease;
            border: 2px solid transparent; position: relative;
        }
        .group-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .group-card.active { border-color: var(--primary); }
        .group-card.completed { border-color: var(--success); }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .group-name { font-size: 18px; font-weight: 600; }
        .word-count {
            background: var(--bg); padding: 4px 10px; border-radius: 12px; font-size: 13px; color: var(--text-light);
        }
        .group-progress { display: flex; align-items: center; gap: 10px; }
        .progress-bar {
            flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden;
        }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s ease; }
        .progress-fill.completed { background: var(--success); }
        .progress-text { font-size: 13px; color: var(--text-light); min-width: 50px; text-align: right; }
        .start-indicator {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background: var(--primary); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .group-card:hover .start-indicator { opacity: 1; }

        .quiz-screen { display: none; height: 100vh; flex-direction: column; background: var(--bg); }
        .quiz-header {
            background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .quiz-info { display: flex; align-items: center; gap: 15px; }
        .pause-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; color: var(--text-light); }
        .timer { font-size: 14px; color: var(--text-light); font-variant-numeric: tabular-nums; }
        .progress-indicator { font-size: 14px; color: var(--text-light); }
        .quiz-body {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; position: relative;
        }
        .word-card {
            background: var(--card); width: 100%; max-width: 400px; border-radius: 24px;
            padding: 40px 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center;
            position: relative; overflow: hidden;
        }
        .word-display { font-size: 42px; font-weight: bold; color: var(--text); margin-bottom: 30px; letter-spacing: -0.5px; }
        .word-phonetic { font-size: 16px; color: var(--text-light); margin-bottom: 20px; }

        /* 修复后的显示区域样式 */
        .reveal-container {
            min-height: 150px; background: var(--bg); border-radius: 16px;
            border: 2px dashed var(--border); cursor: pointer;
            transition: all 0.3s ease; position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px;
        }
        .reveal-container:hover { border-color: var(--primary); background: #f1f5f9; }
        .reveal-container.revealed { 
            border-style: solid; border-color: var(--primary); 
            background: white; cursor: default; align-items: flex-start;
        }
        .reveal-hint { 
            color: var(--text-light); font-size: 14px; text-align: center;
            pointer-events: none; user-select: none;
        }
        .word-details { 
            display: none; width: 100%; text-align: left;
        }
        .word-details.show { display: block; }
        .detail-row { margin-bottom: 12px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { 
            font-size: 11px; color: var(--text-light); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600;
        }
        .detail-content { font-size: 16px; color: var(--text); line-height: 1.5; }
        .detail-content.pos { color: var(--primary); font-weight: 600; }

        .countdown-bar {
            position: absolute; top: 0; left: 0; height: 4px; background: var(--primary);
            transition: width 0.1s linear; width: 100%;
        }
        .countdown-bar.warning { background: var(--warning); }
        .countdown-bar.danger { background: var(--danger); }

        .action-buttons { display: none; gap: 15px; margin-top: 25px; }
        .action-buttons.show { display: flex; }
        .action-btn {
            flex: 1; padding: 14px 24px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s ease;
        }
        .remember-btn { background: var(--success); color: white; }
        .remember-btn:hover { background: #059669; }
        .vague-btn { background: var(--warning); color: white; }
        .vague-btn:hover { background: #d97706; }
        .next-btn { background: var(--primary); color: white; width: 100%; margin-top: 20px; }
        .next-btn:hover { background: var(--primary-dark); }
        .hidden { display: none !important; }

        .pause-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .pause-modal.show { display: flex; }
        .pause-content {
            background: var(--card); padding: 30px; border-radius: 20px;
            width: 90%; max-width: 320px; text-align: center;
        }
        .pause-title { font-size: 20px; margin-bottom: 20px; }
        .pause-warning {
            background: #fef3c7; border: 1px solid #fcd34d; color: #92400e;
            padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
        }
        .pause-buttons { display: flex; flex-direction: column; gap: 12px; }
        .pause-btn { padding: 14px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: all 0.2s ease; }
        .continue-btn { background: var(--primary); color: white; }
        .home-btn { background: var(--bg); color: var(--text); }

        .result-screen { display: none; padding: 20px; max-width: 600px; margin: 0 auto; min-height: 100vh; }
        .result-header { text-align: center; padding: 30px 0; }
        .result-title { font-size: 24px; margin-bottom: 10px; }
        .result-stats {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px;
        }
        .result-stat { background: var(--card); padding: 20px; border-radius: 16px; text-align: center; }
        .result-stat-value { font-size: 28px; font-weight: bold; color: var(--primary); }
        .result-stat-label { font-size: 13px; color: var(--text-light); margin-top: 5px; }
        .accuracy-ring { width: 120px; height: 120px; margin: 20px auto; position: relative; }
        .accuracy-svg { transform: rotate(-90deg); }
        .accuracy-bg { fill: none; stroke: var(--border); stroke-width: 8; }
        .accuracy-fill { fill: none; stroke: var(--success); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray 0.5s ease; }
        .accuracy-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 24px; font-weight: bold; color: var(--text);
        }
        .word-list { background: var(--card); border-radius: 16px; overflow: hidden; margin-bottom: 20px; }
        .list-header {
            padding: 15px 20px; background: var(--bg); font-weight: 600; font-size: 14px;
            display: flex; justify-content: space-between;
        }
        .word-item {
            padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .word-item:last-child { border-bottom: none; }
        .word-info { flex: 1; }
        .word-name { font-weight: 600; margin-bottom: 4px; }
        .word-meaning { font-size: 13px; color: var(--text-light); }
        .word-status { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status-remember { background: #d1fae5; color: #065f46; }
        .status-vague { background: #fef3c7; color: #92400e; }
        .result-actions { display: flex; gap: 12px; margin-top: 20px; }
        .result-btn {
            flex: 1; padding: 14px; border: none; border-radius: 10px;
            font-size: 15px; cursor: pointer; transition: all 0.2s ease;
        }
        .export-btn { background: var(--primary); color: white; }
        .restart-btn { background: var(--bg); color: var(--text); }
        .home-return-btn { background: var(--card); color: var(--text); border: 2px solid var(--border); }

        .export-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
        }
        .export-modal.show { display: flex; }
        .export-content {
            background: var(--card); width: 90%; max-width: 500px; max-height: 80vh;
            border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
        }
        .export-header {
            padding: 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .export-body { flex: 1; overflow-y: auto; padding: 20px; }
        .export-text {
            font-family: monospace; font-size: 13px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-all;
        }
        .export-footer { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .copy-btn, .close-export-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .copy-btn { background: var(--primary); color: white; }
        .close-export-btn { background: var(--bg); color: var(--text); }

        @media (max-width: 480px) {
            .word-display { font-size: 36px; }
            .stats-overview { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .stat-card { padding: 15px 10px; }
            .stat-number { font-size: 20px; }
        }
        @media (min-width: 768px) {
            .word-card { max-width: 500px; padding: 50px 40px; }
            .word-display { font-size: 48px; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease; }
    </style>
</head>
<body>
    <!-- 首页 -->
    <div class="home-screen" id="homeScreen">
        <div class="header">
            <h1>📚 高考词汇检测</h1>
            <p>26年3月市统测词汇分析</p>
        </div>
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-number" id="totalWords">0</div>
                <div class="stat-label">总词汇量</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="masteredWords">0</div>
                <div class="stat-label">已掌握</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completionRate">0%</div>
                <div class="stat-label">完成率</div>
            </div>
        </div>
        <div class="groups-container">
            <div class="section-title">
                选择题型分组开始检测
                <span class="progress-badge" id="groupsBadge">0/8</span>
            </div>
            <div id="groupsList"></div>
        </div>
    </div>

    <!-- 检测界面 -->
    <div class="quiz-screen" id="quizScreen">
        <div class="quiz-header">
            <div class="quiz-info">
                <button class="pause-btn" id="pauseBtn">⏸️</button>
                <span class="timer" id="timer">00:00</span>
            </div>
            <span class="progress-indicator" id="quizProgress">1/20</span>
        </div>
        <div class="quiz-body">
            <div class="word-card" id="wordCard">
                <div class="countdown-bar" id="countdownBar"></div>
                <div class="word-display" id="wordDisplay">word</div>

                <!-- 修复后的显示区域 -->
                <div class="reveal-container" id="revealContainer">
                    <div class="reveal-hint" id="revealHint">点击此处查看词义（5秒）</div>
                    <div class="word-details" id="wordDetails">
                        <div class="detail-row">
                            <div class="detail-label">词性</div>
                            <div class="detail-content pos" id="detailPos">n.</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">词义</div>
                            <div class="detail-content" id="detailMeaning">词义内容</div>
                        </div>
                        <div class="detail-row" id="extraMeaningRow">
                            <div class="detail-label">高考其他常考词义</div>
                            <div class="detail-content" id="detailExtra">额外词义</div>
                        </div>
                    </div>
                </div>

                <div class="action-buttons" id="actionButtons">
                    <button class="action-btn remember-btn" id="rememberBtn">✓ 记得</button>
                    <button class="action-btn vague-btn" id="vagueBtn">? 模糊</button>
                </div>
                <button class="action-btn next-btn hidden" id="nextBtn">下一个 →</button>
            </div>
        </div>
    </div>

    <!-- 暂停弹窗 -->
    <div class="pause-modal" id="pauseModal">
        <div class="pause-content">
            <div class="pause-title">⏸️ 检测暂停</div>
            <div class="pause-warning">
                ⚠️ 注意：返回首页将清空当前检测进度，但已检测的单词记录会保留。
            </div>
            <div class="pause-buttons">
                <button class="pause-btn continue-btn" id="continueBtn">继续检测</button>
                <button class="pause-btn home-btn" id="homeBtn">返回首页</button>
            </div>
        </div>
    </div>

    <!-- 结果页 -->
    <div class="result-screen" id="resultScreen">
        <div class="result-header">
            <div class="result-title">🎉 检测完成</div>
            <p style="color: var(--text-light); margin-top: 5px;">本次检测结果统计</p>
        </div>
        <div class="accuracy-ring">
            <svg class="accuracy-svg" width="120" height="120">
                <circle class="accuracy-bg" cx="60" cy="60" r="52"></circle>
                <circle class="accuracy-fill" id="accuracyCircle" cx="60" cy="60" r="52"></circle>
            </svg>
            <div class="accuracy-text" id="accuracyText">0%</div>
        </div>
        <div class="result-stats">
            <div class="result-stat">
                <div class="result-stat-value" id="resultTime">00:00</div>
                <div class="result-stat-label">检测时长</div>
            </div>
            <div class="result-stat">
                <div class="result-stat-value" id="resultCount">0</div>
                <div class="result-stat-label">检测数量</div>
            </div>
            <div class="result-stat">
                <div class="result-stat-value" id="resultRemember">0</div>
                <div class="result-stat-label">记得</div>
            </div>
            <div class="result-stat">
                <div class="result-stat-value" id="resultVague">0</div>
                <div class="result-stat-label">模糊</div>
            </div>
        </div>
        <div class="word-list">
            <div class="list-header">
                <span>单词掌握详情</span>
                <span id="listStats">记得 0 | 模糊 0</span>
            </div>
            <div id="wordListBody"></div>
        </div>
        <div class="result-actions">
            <button class="result-btn export-btn" id="exportBtn">📋 导出详情</button>
            <button class="result-btn restart-btn" id="restartBtn">🔄 再测一次</button>
            <button class="result-btn home-return-btn" id="homeReturnBtn">🏠 返回首页</button>
        </div>
    </div>

    <!-- 导出弹窗 -->
    <div class="export-modal" id="exportModal">
        <div class="export-content">
            <div class="export-header">
                <span style="font-weight: 600;">导出数据</span>
                <button onclick="closeExport()" style="background: none; border: none; font-size: 20px; cursor: pointer;">×</button>
            </div>
            <div class="export-body">
                <div class="export-text" id="exportText"></div>
            </div>
            <div class="export-footer">
                <button class="copy-btn" id="copyBtn">复制到剪贴板</button>
                <button class="close-export-btn" onclick="closeExport()">关闭</button>
            </div>
        </div>
    </div>

        // 存储管理
        const StorageManager = {
            getKey(key) { return `vocab_${key}`; },
            getProgress() {
                const data = localStorage.getItem(this.getKey('progress'));
                return data ? JSON.parse(data) : {};
            },
            saveProgress(groupName, progress) {
                const allProgress = this.getProgress();
                allProgress[groupName] = { ...progress, lastStudy: new Date().toISOString() };
                localStorage.setItem(this.getKey('progress'), JSON.stringify(allProgress));
            },
            getWordStatus() {
                const data = localStorage.getItem(this.getKey('wordStatus'));
                return data ? JSON.parse(data) : {};
            },
            saveWordStatus(word, status) {
                const allStatus = this.getWordStatus();
                allStatus[word] = { status: status, updatedAt: new Date().toISOString() };
                localStorage.setItem(this.getKey('wordStatus'), JSON.stringify(allStatus));
            },
            getStudyStats() {
                const data = localStorage.getItem(this.getKey('stats'));
                return data ? JSON.parse(data) : { totalStudied: 0, totalMastered: 0, studyHistory: [] };
            },
            saveStudyStats(stats) {
                localStorage.setItem(this.getKey('stats'), JSON.stringify(stats));
            },
            clearGroupProgress(groupName) {
                const allProgress = this.getProgress();
                delete allProgress[groupName];
                localStorage.setItem(this.getKey('progress'), JSON.stringify(allProgress));
            }
        };

        // 应用逻辑
        const App = {
            currentGroup: null,
            currentWords: [],
            currentIndex: 0,
            quizResults: [],
            startTime: null,
            timerInterval: null,
            countdownInterval: null,
            countdownTime: 5000,
            isPaused: false,
            isRevealed: false,

            init() {
                this.renderHome();
                this.bindEvents();
            },

            renderHome() {
                const groups = Object.keys(vocabularyData);
                const progress = StorageManager.getProgress();
                const wordStatus = StorageManager.getWordStatus();

                let totalWords = 0;
                let masteredWords = 0;
                let completedGroups = 0;

                groups.forEach(group => {
                    const words = vocabularyData[group];
                    totalWords += words.length;
                    const groupProgress = progress[group];
                    if (groupProgress && groupProgress.completed) {
                        completedGroups++;
                        masteredWords += groupProgress.mastered || 0;
                    }
                });

                document.getElementById('totalWords').textContent = totalWords;
                document.getElementById('masteredWords').textContent = Object.values(wordStatus).filter(s => s.status === 'remember').length;
                document.getElementById('completionRate').textContent = Math.round((completedGroups / groups.length) * 100) + '%';
                document.getElementById('groupsBadge').textContent = `${completedGroups}/${groups.length}`;

                const groupsList = document.getElementById('groupsList');
                groupsList.innerHTML = groups.map(group => {
                    const words = vocabularyData[group];
                    const groupProgress = progress[group];
                    const isCompleted = groupProgress && groupProgress.completed;
                    const studiedCount = groupProgress ? groupProgress.studied || 0 : 0;
                    const progressPercent = Math.round((studiedCount / words.length) * 100);

                    return `
                        <div class="group-card ${isCompleted ? 'completed' : ''}" data-group="${group}" onclick="App.selectGroup('${group}')">
                            <div class="group-header">
                                <div class="group-name">${group}</div>
                                <div class="word-count">${words.length}词</div>
                            </div>
                            <div class="group-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill ${isCompleted ? 'completed' : ''}" style="width: ${progressPercent}%"></div>
                                </div>
                                <div class="progress-text">${isCompleted ? '已完成' : (studiedCount > 0 ? `${progressPercent}%` : '未开始')}</div>
                            </div>
                            <div class="start-indicator">点击开始 ▶</div>
                        </div>
                    `;
                }).join('');
            },

            // 点击分组直接开始
            selectGroup(groupName) {
                this.currentGroup = groupName;
                this.startQuiz();
            },

            bindEvents() {
                document.getElementById('pauseBtn').addEventListener('click', () => this.pauseQuiz());
                document.getElementById('continueBtn').addEventListener('click', () => this.resumeQuiz());
                document.getElementById('homeBtn').addEventListener('click', () => this.confirmReturnHome());

                // 修复后的点击事件绑定
                const revealContainer = document.getElementById('revealContainer');
                revealContainer.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (!this.isRevealed && !this.isPaused) {
                        this.revealWord();
                    }
                });

                // 触摸事件支持
                revealContainer.addEventListener('touchstart', (e) => {
                    if (!this.isRevealed && !this.isPaused) {
                        e.preventDefault();
                        this.revealWord();
                    }
                }, {passive: false});

                document.getElementById('rememberBtn').addEventListener('click', () => this.recordResult('remember'));
                document.getElementById('vagueBtn').addEventListener('click', () => this.recordResult('vague'));
                document.getElementById('nextBtn').addEventListener('click', () => this.nextWord());

                document.getElementById('exportBtn').addEventListener('click', () => this.exportResults());
                document.getElementById('restartBtn').addEventListener('click', () => this.startQuiz());
                document.getElementById('homeReturnBtn').addEventListener('click', () => this.showHome());
                document.getElementById('copyBtn').addEventListener('click', () => this.copyExportData());
            },

            startQuiz() {
                if (!this.currentGroup) return;

                const allWords = [...vocabularyData[this.currentGroup]];
                this.currentWords = this.shuffleArray(allWords);
                this.currentIndex = 0;
                this.quizResults = [];
                this.startTime = Date.now();
                this.isPaused = false;
                this.isRevealed = false;

                document.getElementById('homeScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'none';
                document.getElementById('quizScreen').style.display = 'flex';

                this.startTimer();
                this.showWord();
            },

            shuffleArray(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            },

            startTimer() {
                this.timerInterval = setInterval(() => {
                    if (!this.isPaused) {
                        const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                        const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                        const seconds = (elapsed % 60).toString().padStart(2, '0');
                        document.getElementById('timer').textContent = `${minutes}:${seconds}`;
                    }
                }, 1000);
            },

            showWord() {
                if (this.currentIndex >= this.currentWords.length) {
                    this.finishQuiz();
                    return;
                }

                const word = this.currentWords[this.currentIndex];
                this.isRevealed = false;

                document.getElementById('quizProgress').textContent = `${this.currentIndex + 1}/${this.currentWords.length}`;
                document.getElementById('wordDisplay').textContent = word.word;

                // 重置显示区域
                const container = document.getElementById('revealContainer');
                container.classList.remove('revealed');
                document.getElementById('revealHint').style.display = 'block';
                document.getElementById('wordDetails').classList.remove('show');

                // 重置按钮
                document.getElementById('actionButtons').classList.remove('show');
                document.getElementById('nextBtn').classList.add('hidden');

                // 重置倒计时条
                const countdownBar = document.getElementById('countdownBar');
                countdownBar.style.width = '100%';
                countdownBar.classList.remove('warning', 'danger');

                // 开始倒计时
                this.startCountdown();
            },

            startCountdown() {
                let remaining = this.countdownTime;
                const bar = document.getElementById('countdownBar');

                this.countdownInterval = setInterval(() => {
                    if (this.isPaused) return;

                    remaining -= 100;
                    const percentage = (remaining / this.countdownTime) * 100;
                    bar.style.width = percentage + '%';

                    if (percentage <= 40 && percentage > 20) bar.classList.add('warning');
                    else if (percentage <= 20) { bar.classList.remove('warning'); bar.classList.add('danger'); }

                    if (remaining <= 0) {
                        clearInterval(this.countdownInterval);
                        this.revealWord();
                        setTimeout(() => { if (this.isRevealed) this.recordResult('vague'); }, 100);
                    }
                }, 100);
            },

            revealWord() {
                if (this.isRevealed) return;

                clearInterval(this.countdownInterval);
                this.isRevealed = true;

                const word = this.currentWords[this.currentIndex];

                // 更新UI显示词义
                const container = document.getElementById('revealContainer');
                container.classList.add('revealed');
                document.getElementById('revealHint').style.display = 'none';
                document.getElementById('wordDetails').classList.add('show');
                document.getElementById('detailPos').textContent = word.pos || '无';
                document.getElementById('detailMeaning').textContent = word.meaning || '暂无释义';

                const extraRow = document.getElementById('extraMeaningRow');
                if (word.extra) {
                    extraRow.style.display = 'block';
                    document.getElementById('detailExtra').textContent = word.extra;
                } else {
                    extraRow.style.display = 'none';
                }

                document.getElementById('actionButtons').classList.add('show');
            },

            recordResult(result) {
                const word = this.currentWords[this.currentIndex];

                this.quizResults.push({
                    word: word.word,
                    pos: word.pos,
                    meaning: word.meaning,
                    result: result,
                    timestamp: new Date().toISOString()
                });

                StorageManager.saveWordStatus(word.word, result);

                document.getElementById('actionButtons').classList.remove('show');
                document.getElementById('nextBtn').classList.remove('hidden');
            },

            nextWord() {
                this.currentIndex++;
                this.showWord();
            },

            pauseQuiz() {
                this.isPaused = true;
                clearInterval(this.countdownInterval);
                document.getElementById('pauseModal').classList.add('show');
            },

            resumeQuiz() {
                this.isPaused = false;
                document.getElementById('pauseModal').classList.remove('show');
                if (!this.isRevealed) this.startCountdown();
            },

            confirmReturnHome() {
                if (confirm('确定要返回首页吗？当前检测进度将丢失，但已检测的单词记录会保留。')) {
                    clearInterval(this.timerInterval);
                    clearInterval(this.countdownInterval);
                    document.getElementById('pauseModal').classList.remove('show');
                    this.showHome();
                }
            },

            finishQuiz() {
                clearInterval(this.timerInterval);
                clearInterval(this.countdownInterval);

                const rememberCount = this.quizResults.filter(r => r.result === 'remember').length;
                const vagueCount = this.quizResults.filter(r => r.result === 'vague').length;

                StorageManager.saveProgress(this.currentGroup, {
                    studied: this.currentWords.length,
                    mastered: rememberCount,
                    completed: true,
                    lastScore: Math.round((rememberCount / this.currentWords.length) * 100)
                });

                const stats = StorageManager.getStudyStats();
                stats.totalStudied += this.currentWords.length;
                stats.totalMastered += rememberCount;
                stats.studyHistory.push({
                    group: this.currentGroup,
                    date: new Date().toISOString(),
                    total: this.currentWords.length,
                    remember: rememberCount,
                    vague: vagueCount
                });
                StorageManager.saveStudyStats(stats);

                this.showResults();
            },

            showResults() {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'block';

                const rememberCount = this.quizResults.filter(r => r.result === 'remember').length;
                const vagueCount = this.quizResults.filter(r => r.result === 'vague').length;
                const total = this.quizResults.length;
                const accuracy = Math.round((rememberCount / total) * 100);

                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const seconds = (elapsed % 60).toString().padStart(2, '0');

                document.getElementById('resultTime').textContent = `${minutes}:${seconds}`;
                document.getElementById('resultCount').textContent = total;
                document.getElementById('resultRemember').textContent = rememberCount;
                document.getElementById('resultVague').textContent = vagueCount;
                document.getElementById('listStats').textContent = `记得 ${rememberCount} | 模糊 ${vagueCount}`;

                const circle = document.getElementById('accuracyCircle');
                const radius = 52;
                const circumference = 2 * Math.PI * radius;
                const offset = circumference - (accuracy / 100) * circumference;
                circle.style.strokeDasharray = circumference;
                circle.style.strokeDashoffset = offset;
                document.getElementById('accuracyText').textContent = accuracy + '%';

                const listBody = document.getElementById('wordListBody');
                listBody.innerHTML = this.quizResults.map(r => `
                    <div class="word-item">
                        <div class="word-info">
                            <div class="word-name">${r.word}</div>
                            <div class="word-meaning">${r.pos} ${r.meaning}</div>
                        </div>
                        <span class="word-status ${r.result === 'remember' ? 'status-remember' : 'status-vague'}">
                            ${r.result === 'remember' ? '记得' : '模糊'}
                        </span>
                    </div>
                `).join('');
            },

            exportResults() {
                const rememberCount = this.quizResults.filter(r => r.result === 'remember').length;
                const vagueCount = this.quizResults.filter(r => r.result === 'vague').length;
                const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;

                let exportText = `高考词汇检测记录\n`;
                exportText += `==================\n\n`;
                exportText += `检测组别：${this.currentGroup}\n`;
                exportText += `检测时间：${new Date().toLocaleString()}\n`;
                exportText += `检测时长：${minutes}分${seconds}秒\n`;
                exportText += `总词汇数：${this.quizResults.length}\n`;
                exportText += `掌握情况：记得 ${rememberCount} | 模糊 ${vagueCount}\n`;
                exportText += `正确率：${Math.round((rememberCount / this.quizResults.length) * 100)}%\n\n`;
                exportText += `详细记录：\n`;
                exportText += `------------------\n`;

                this.quizResults.forEach((r, i) => {
                    exportText += `${i + 1}. ${r.word} [${r.pos}] ${r.meaning}\n`;
                    exportText += `   状态：${r.result === 'remember' ? '✓ 记得' : '? 模糊'}\n`;
                    if (r.result === 'vague') exportText += `   ⚠️ 需要复习\n`;
                    exportText += `\n`;
                });

                document.getElementById('exportText').textContent = exportText;
                document.getElementById('exportModal').classList.add('show');
            },

            copyExportData() {
                const text = document.getElementById('exportText').textContent;
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyBtn');
                    btn.textContent = '已复制！';
                    btn.style.background = '#10b981';
                    setTimeout(() => {
                        btn.textContent = '复制到剪贴板';
                        btn.style.background = '';
                    }, 2000);
                });
            },

            showHome() {
                document.getElementById('quizScreen').style.display = 'none';
                document.getElementById('resultScreen').style.display = 'none';
                document.getElementById('homeScreen').style.display = 'block';
                this.currentGroup = null;
                this.renderHome();
            }
        };

        function closeExport() {
            document.getElementById('exportModal').classList.remove('show');
        }

        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
