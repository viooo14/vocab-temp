<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>初三单词 - 匹配闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title .icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        .group-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .group-btn {
            background: #f8f9fa;
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .group-btn:active {
            transform: scale(0.96);
        }

        .group-btn:hover {
            border-color: #667eea;
            background: #f0f3ff;
        }

        .group-btn.completed {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
        }

        .group-btn.completed .group-name,
        .group-btn.completed .group-range,
        .group-btn.completed .group-progress {
            color: white;
        }

        .group-name {
            font-size: 16px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        .group-range {
            font-size: 12px;
            color: #999;
            margin-bottom: 6px;
        }

        .group-progress {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
        }

        .group-btn.completed .star {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 16px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: white;
        }

        .game-header .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .game-info {
            display: flex;
            gap: 12px;
            font-size: 13px;
        }

        .game-info span {
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .round-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            padding: 0 20px;
        }

        .round-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.3s;
        }

        .round-dot.current {
            background: #feca57;
            transform: scale(1.3);
            box-shadow: 0 0 8px rgba(254, 202, 87, 0.6);
        }

        .round-dot.completed {
            background: #38ef7d;
        }

        .round-dot.error {
            background: #ff6b6b;
        }

        .progress-bar {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 8px;
            margin: 0 0 12px 0;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #f093fb, #f5576c);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .hint-text {
            text-align: center;
            color: rgba(255,255,255,0.85);
            font-size: 13px;
            margin-bottom: 12px;
            padding: 0 20px;
            min-height: 20px;
        }

        .match-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-item {
            background: white;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s;
            border: 2px solid transparent;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            user-select: none;
            word-break: break-all;
            line-height: 1.4;
        }

        .match-item:active {
            transform: scale(0.96);
        }

        .match-item.english {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }

        .match-item.chinese {
            font-size: 14px;
            color: #555;
        }

        .match-item.selected {
            border-color: #667eea;
            background: #f0f3ff;
            transform: scale(1.03);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .match-item.matched {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border-color: transparent;
            animation: matchPulse 0.5s ease;
            pointer-events: none;
        }

        .match-item.error {
            animation: shake 0.5s ease, errorFlash 0.5s ease;
            border-color: #ff6b6b;
            background: #fff0f0;
        }

        .match-item.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        @keyframes matchPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes errorFlash {
            0%, 100% { background: white; }
            50% { background: #fff0f0; }
        }

        .error-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ff6b6b;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            z-index: 1000;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 1.2s;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.4);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translate(-50%, -50%); }
            to { opacity: 0; transform: translate(-50%, -60%); }
        }

        .review-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .review-title {
            font-size: 18px;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 16px;
            text-align: center;
        }

        .review-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .review-word {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .review-meaning {
            color: #666;
            font-size: 14px;
            text-align: right;
            max-width: 60%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-secondary:active {
            background: #e0e0e0;
        }

        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.5s ease;
        }

        .victory-card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            animation: scaleIn 0.5s ease 0.2s both;
        }

        .victory-emoji {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .victory-title {
            font-size: 24px;
            font-weight: 700;
            color: #11998e;
            margin-bottom: 8px;
        }

        .victory-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 24px;
        }

        .victory-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .victory-stat {
            text-align: center;
        }

        .victory-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }

        .victory-stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .round-transition {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1500;
            animation: fadeIn 0.3s ease;
        }

        .round-transition-card {
            text-align: center;
            color: white;
            animation: scaleIn 0.4s ease;
        }

        .round-transition-card .emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .round-transition-card .text {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .round-transition-card .sub {
            font-size: 14px;
            opacity: 0.9;
        }

        @media (max-width: 360px) {
            .match-item {
                padding: 14px 10px;
                font-size: 13px;
                min-height: 56px;
            }
            .match-item.english {
                font-size: 15px;
            }
            .group-grid {
                gap: 8px;
            }
            .group-btn {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 首页 -->
        <div class="page active" id="homePage">
            <div class="header">
                <h1>🎯 初三单词检测</h1>
                <p>匹配闯关 · 2组×40词</p>
            </div>

            <div class="card">
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-value" id="totalGroups">2</div>
                        <div class="stat-label">总组数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedGroups">0</div>
                        <div class="stat-label">已通关</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalWords">80</div>
                        <div class="stat-label">总词汇</div>
                    </div>
                </div>
                <div class="card-title">
                    <div class="icon">📚</div>
                    选择组别
                </div>
                <div class="group-grid" id="groupGrid"></div>
            </div>
        </div>

        <!-- 游戏页 -->
        <div class="page" id="gamePage">
            <div class="game-header">
                <button class="back-btn" onclick="goHome()">← 返回</button>
                <div class="game-info">
                    <span id="gameStage">第1/5轮</span>
                    <span id="matchProgress">0/8</span>
                </div>
            </div>

            <div class="round-indicator" id="roundIndicator"></div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>

            <p class="hint-text" id="gameHint">点击英文和对应的中文进行匹配</p>

            <div class="match-area" id="matchArea"></div>

            <div class="review-section" id="reviewSection" style="display:none;">
                <div class="review-title">📋 错题复习</div>
                <div id="reviewList"></div>
                <button class="btn-primary" id="retryBtn" onclick="startRetry()">🔄 重新匹配错误词汇</button>
            </div>
        </div>
    </div>

    <!-- 引入外部词汇数据 -->
    <script src="words.js"></script>
    <script>
        const WORDS_PER_ROUND = 8;

        // 游戏状态
        let currentGroup = null;
        let currentRound = 0;
        let totalRounds = 0;
        let roundWords = [];
        let groupWords = [];
        let selectedEnglish = null;
        let selectedChinese = null;
        let matchedPairs = 0;
        let roundErrorWords = [];
        let allErrorWords = [];
        let isProcessing = false;
        let roundStatus = [];
        let isRetryMode = false;

        const STORAGE_KEY = 'vocab_match_progress_v2';

        function getProgress() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch(e) {
                return {};
            }
        }

        function saveProgress(groupId) {
            const progress = getProgress();
            progress[groupId] = { completed: true, timestamp: Date.now() };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
            updateHomeStats();
        }

        function isGroupCompleted(groupId) {
            const progress = getProgress();
            return progress[groupId] && progress[groupId].completed;
        }

        function initHome() {
            const grid = document.getElementById('groupGrid');
            grid.innerHTML = '';

            GAME_DATA.forEach(group => {
                const completed = isGroupCompleted(group.id);
                const btn = document.createElement('div');
                btn.className = 'group-btn' + (completed ? ' completed' : '');
                btn.innerHTML = `
                    <div class="group-name">${group.name}</div>
                    <div class="group-range">${group.range}</div>
                    <div class="group-progress">${group.words.length}词 ${completed ? '✅ 已通关' : ''}</div>
                    ${completed ? '<span class="star">⭐</span>' : ''}
                `;
                btn.onclick = () => startGame(group.id);
                grid.appendChild(btn);
            });

            updateHomeStats();
        }

        function updateHomeStats() {
            const progress = getProgress();
            const completed = Object.values(progress).filter(p => p.completed).length;
            document.getElementById('completedGroups').textContent = completed;
        }

        function getTotalRounds(group) {
            return Math.ceil(group.words.length / WORDS_PER_ROUND);
        }

        function getRoundWords(group, roundIndex) {
            const start = roundIndex * WORDS_PER_ROUND;
            const end = Math.min(start + WORDS_PER_ROUND, group.words.length);
            return group.words.slice(start, end);
        }

        function startGame(groupId) {
            currentGroup = GAME_DATA.find(g => g.id === groupId);
            if (!currentGroup) return;

            totalRounds = getTotalRounds(currentGroup);
            currentRound = 0;
            roundErrorWords = [];
            allErrorWords = [];
            isRetryMode = false;
            roundStatus = new Array(totalRounds).fill('pending');
            groupWords = [...currentGroup.words];

            document.getElementById('homePage').classList.remove('active');
            document.getElementById('gamePage').classList.add('active');
            document.getElementById('reviewSection').style.display = 'none';

            renderRoundIndicator();
            startRound(0);
        }

        function goHome() {
            document.getElementById('gamePage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
            const overlay = document.querySelector('.victory-overlay');
            if (overlay) overlay.remove();
        }

        function renderRoundIndicator() {
            const container = document.getElementById('roundIndicator');
            container.innerHTML = '';
            for (let i = 0; i < totalRounds; i++) {
                const dot = document.createElement('div');
                dot.className = 'round-dot';
                if (roundStatus[i] === 'completed') dot.classList.add('completed');
                else if (roundStatus[i] === 'error') dot.classList.add('error');
                else if (i === currentRound) dot.classList.add('current');
                container.appendChild(dot);
            }
        }

        function startRound(roundIndex) {
            currentRound = roundIndex;
            matchedPairs = 0;
            roundErrorWords = [];
            selectedEnglish = null;
            selectedChinese = null;
            isProcessing = false;

            if (isRetryMode) {
                roundWords = [...allErrorWords];
                if (roundWords.length > WORDS_PER_ROUND) {
                    shuffleArray(roundWords);
                    roundWords = roundWords.slice(0, WORDS_PER_ROUND);
                }
                document.getElementById('gameStage').textContent = '重试轮';
                document.getElementById('gameHint').textContent = `重新匹配 ${allErrorWords.length} 个错误词汇`;
            } else {
                roundWords = getRoundWords(currentGroup, roundIndex);
                document.getElementById('gameStage').textContent = `第${roundIndex + 1}/${totalRounds}轮`;
                document.getElementById('gameHint').textContent = '点击英文和对应的中文进行匹配';
            }

            renderRoundIndicator();
            renderMatchArea();
            updateProgress();
        }

        function renderMatchArea() {
            const area = document.getElementById('matchArea');
            area.innerHTML = '';

            const englishCol = document.createElement('div');
            englishCol.className = 'match-column';

            const chineseCol = document.createElement('div');
            chineseCol.className = 'match-column';

            const englishWords = roundWords.map((w, i) => ({ ...w, originalIndex: i }));
            const chineseWords = roundWords.map((w, i) => ({
                id: w.id,
                meaning: w.meaning,
                originalIndex: i
            }));

            shuffleArray(englishWords);
            shuffleArray(chineseWords);

            englishWords.forEach(item => {
                const el = document.createElement('div');
                el.className = 'match-item english';
                el.dataset.id = item.id;
                el.dataset.type = 'english';
                el.textContent = item.word;
                el.onclick = () => onItemClick(el, 'english');
                englishCol.appendChild(el);
            });

            chineseWords.forEach(item => {
                const el = document.createElement('div');
                el.className = 'match-item chinese';
                el.dataset.id = item.id;
                el.dataset.type = 'chinese';
                el.textContent = item.meaning;
                el.onclick = () => onItemClick(el, 'chinese');
                chineseCol.appendChild(el);
            });

            area.appendChild(englishCol);
            area.appendChild(chineseCol);
        }

        function onItemClick(el, type) {
            if (isProcessing) return;
            if (el.classList.contains('matched') || el.classList.contains('disabled')) return;

            if (type === 'english' && selectedEnglish) {
                selectedEnglish.classList.remove('selected');
            }
            if (type === 'chinese' && selectedChinese) {
                selectedChinese.classList.remove('selected');
            }

            el.classList.add('selected');

            if (type === 'english') {
                selectedEnglish = el;
            } else {
                selectedChinese = el;
            }

            if (selectedEnglish && selectedChinese) {
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const englishId = parseInt(selectedEnglish.dataset.id);
            const chineseId = parseInt(selectedChinese.dataset.id);

            if (englishId === chineseId) {
                selectedEnglish.classList.remove('selected');
                selectedChinese.classList.remove('selected');
                selectedEnglish.classList.add('matched');
                selectedChinese.classList.add('matched');

                matchedPairs++;
                updateProgress();

                selectedEnglish = null;
                selectedChinese = null;
                isProcessing = false;

                if (matchedPairs >= roundWords.length) {
                    setTimeout(onRoundComplete, 600);
                }
            } else {
                selectedEnglish.classList.add('error');
                selectedChinese.classList.add('error');

                const word = roundWords.find(w => w.id === englishId);
                if (word) {
                    roundErrorWords.push(word);
                    if (!allErrorWords.find(e => e.id === word.id)) {
                        allErrorWords.push(word);
                    }
                }

                showErrorToast();

                setTimeout(() => {
                    selectedEnglish.classList.remove('selected', 'error');
                    selectedChinese.classList.remove('selected', 'error');
                    selectedEnglish = null;
                    selectedChinese = null;
                    isProcessing = false;
                }, 600);
            }
        }

        function showErrorToast() {
            const toast = document.createElement('div');
            toast.className = 'error-toast';
            toast.textContent = '❌ 不匹配，请重试！';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        function updateProgress() {
            const total = roundWords.length;
            const progress = Math.round((matchedPairs / total) * 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('matchProgress').textContent = `${matchedPairs}/${total}`;
        }

        function onRoundComplete() {
            if (isRetryMode) {
                if (roundErrorWords.length === 0) {
                    const retryIds = roundWords.map(w => w.id);
                    allErrorWords = allErrorWords.filter(w => !retryIds.includes(w.id));

                    if (allErrorWords.length === 0) {
                        if (currentRound < totalRounds - 1) {
                            isRetryMode = false;
                            showRoundTransition(currentRound + 1, 'round');
                        } else {
                            showVictory();
                        }
                    } else {
                        showRoundTransition(null, 'retry');
                    }
                } else {
                    roundStatus = roundStatus.map(s => s === 'error' ? 'pending' : s);
                    showReviewSection();
                }
            } else {
                if (roundErrorWords.length === 0) {
                    roundStatus[currentRound] = 'completed';
                    renderRoundIndicator();

                    if (currentRound < totalRounds - 1) {
                        showRoundTransition(currentRound + 1, 'round');
                    } else if (allErrorWords.length > 0) {
                        showReviewSection();
                    } else {
                        showVictory();
                    }
                } else {
                    roundStatus[currentRound] = 'error';
                    renderRoundIndicator();
                    showReviewSection();
                }
            }
        }

        function showRoundTransition(nextRound, type) {
            const overlay = document.createElement('div');
            overlay.className = 'round-transition';

            if (type === 'round') {
                overlay.innerHTML = `
                    <div class="round-transition-card">
                        <div class="emoji">✨</div>
                        <div class="text">第${nextRound + 1}/${totalRounds}轮</div>
                        <div class="sub">准备开始...</div>
                    </div>
                `;
            } else {
                overlay.innerHTML = `
                    <div class="round-transition-card">
                        <div class="emoji">💪</div>
                        <div class="text">继续重试</div>
                        <div class="sub">还有 ${allErrorWords.length} 个词汇需要巩固</div>
                    </div>
                `;
            }

            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.remove();
                if (type === 'round') {
                    startRound(nextRound);
                } else {
                    isRetryMode = true;
                    startRound(0);
                }
            }, 1500);
        }

        function showReviewSection() {
            const reviewSection = document.getElementById('reviewSection');
            const reviewList = document.getElementById('reviewList');

            reviewList.innerHTML = '';
            const displayWords = isRetryMode ? allErrorWords : roundErrorWords;

            displayWords.forEach(word => {
                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <span class="review-word">${word.word}</span>
                    <span class="review-meaning">${word.meaning}</span>
                `;
                reviewList.appendChild(item);
            });

            reviewSection.style.display = 'block';
            document.getElementById('gameStage').textContent = '错题复习';
            document.getElementById('gameHint').textContent = `共 ${displayWords.length} 个错误，请复习后重新匹配`;

            reviewSection.scrollIntoView({ behavior: 'smooth' });
        }

        function startRetry() {
            const reviewSection = document.getElementById('reviewSection');
            reviewSection.style.display = 'none';

            if (allErrorWords.length === 0) {
                showVictory();
                return;
            }

            isRetryMode = true;
            showRoundTransition(null, 'retry');
        }

        function showVictory() {
            saveProgress(currentGroup.id);

            const overlay = document.createElement('div');
            overlay.className = 'victory-overlay';
            overlay.innerHTML = `
                <div class="victory-card">
                    <div class="victory-emoji">🎉</div>
                    <div class="victory-title">闯关成功！</div>
                    <div class="victory-subtitle">${currentGroup.name} 已通关</div>
                    <div class="victory-stats">
                        <div class="victory-stat">
                            <div class="victory-stat-value">${currentGroup.words.length}</div>
                            <div class="victory-stat-label">词汇数</div>
                        </div>
                        <div class="victory-stat">
                            <div class="victory-stat-value">${totalRounds}</div>
                            <div class="victory-stat-label">总轮数</div>
                        </div>
                    </div>
                    <button class="btn-primary" onclick="goHome()">返回首页</button>
                    <button class="btn-secondary" onclick="nextGroup()">下一组</button>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function nextGroup() {
            const overlay = document.querySelector('.victory-overlay');
            if (overlay) overlay.remove();

            const nextId = currentGroup.id + 1;
            if (nextId <= GAME_DATA.length) {
                startGame(nextId);
            } else {
                goHome();
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        initHome();
    </script>
</body>
</html>
